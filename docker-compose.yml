services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/tmp
      - uploads_data:/app/uploads
    environment:
      PORT: 8080
      OCR_LANGUAGE: por
      OCR_POOL_SIZE: 4
      DATABASE_URL: postgres://ocr:ocr@postgres:5432/ocr_service?sslmode=disable
    depends_on:
      - postgres
      - rabbitmq

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["air", "-c", ".air.worker.toml"]
    volumes:
      - .:/app
      - /app/tmp-worker
      - uploads_data:/app/uploads
    environment:
      OCR_LANGUAGE: por
      OCR_POOL_SIZE: 4
      DATABASE_URL: postgres://ocr:ocr@postgres:5432/ocr_service?sslmode=disable
      AMQP_URL: amqp://ocr:ocr@rabbitmq:5672/
      UPLOAD_DIR: /app/uploads
      PROCESSING_TIMEOUT: 5m
    depends_on:
      - postgres
      - rabbitmq

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ocr
      RABBITMQ_DEFAULT_PASS: ocr

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ocr
      POSTGRES_DB: ocr_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  uploads_data:
